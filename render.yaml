# Optional paid deployment. Review Render's estimated charges before creating it.
# This Blueprint is not applied by Streamlit Community Cloud.
services:
  - type: web
    name: cipher-vault
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    healthCheckPath: /_stcore/health
    disk:
      name: vault-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: VAULT_DATA_DIR
        value: /var/data/cipher-vault
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: VAULT_BOOTSTRAP_TOKEN
        generateValue: true
